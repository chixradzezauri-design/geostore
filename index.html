<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GEOSTORE — Premium Online Store</title>
    <meta name="description" content="აღმოაჩინე GEOSTORE — შერჩეული პროდუქტები, დახვეწილი სტილი და მარტივი ონლაინ შოპინგი." />
    
    <!-- ქეშის აკრძალვისა და მყისიერი განახლების მეტა-ტეგები -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA / Add to Home Screen მითითებები -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f7f4ef" />

    <!-- Tailwind CSS CDN -->
    
    <!-- ქართული შრიფტი -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Manrope', 'Noto Sans Georgian', sans-serif; }
      .scrollbar-none::-webkit-scrollbar { display: none; }
      .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-stone-50 text-stone-900 selection:bg-stone-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
