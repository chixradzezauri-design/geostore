<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    
    <title>GEOSTORE - N1 ტექნიკის ონლაინ მარკეტფლეისი</title>
    
    <!-- PWA & Mobile Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GEOSTORE">
    <meta name="application-name" content="GEOSTORE">
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1513151233558-d86053986c?w=180&h=180&fit=crop">
    <link rel="icon" type="image/jpeg" href="https://images.unsplash.com/photo-1513151233558-d86053986c?w=192&h=192&fit=crop">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <!-- 🚀 ძველი ქეშისა და Service Worker-ის ავტომატური გასუფთავების სკრიპტი -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <noscript>გთხოვთ ჩართოთ JavaScript ამ აპლიკაციის გასაშვებად.</noscript>
    <div id="root"></div>
  </body>
</html>
