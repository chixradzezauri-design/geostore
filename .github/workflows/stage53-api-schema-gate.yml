name: Stage53 Data API private schema release gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/checkApiSchemaExposure.mjs'
      - '.github/workflows/stage53-api-schema-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-api-gate:
    name: Confirm private schema is not exposed through the public Data API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read-only PostgREST schema exposure check (zero rows)
        run: node scripts/checkApiSchemaExposure.mjs
