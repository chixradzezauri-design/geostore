name: Dependency security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate a temporary lockfile for this audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: geostore-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
