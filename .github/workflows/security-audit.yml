name: Dependency security audit

on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The deployed GEOSTORE application is a static frontend. Runtime
      # dependencies are the blocking security gate; build-only tooling is
      # reported separately so an unpatched upstream dev-tool advisory does
      # not silently masquerade as a production-runtime vulnerability.
      - name: Fail on high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Report high or critical vulnerabilities in all dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
