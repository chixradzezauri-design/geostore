name: Stage78 free local Supabase Auth and PostgREST

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage78-free-supabase-auth-postgrest.yml'
      - 'tests/stage78-supabase/**'
      - 'scripts/stage78AuthPostgrest.mjs'
      - 'tests/stage78FreeSupabaseAuthPostgrest.test.js'
      - 'supabase/migrations/20261117231455_admin_staff_auth_foundation.sql'
      - 'supabase/migrations/20261121210000_scope_admin_order_ledger_permissions.sql'
      - 'docs/stage78-free-auth-postgrest-ci.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-http-contract:
    name: Auth-signed JWT / PostgREST / real GEOSTORE Phase A SQL (disposable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start disposable local Auth, PostgREST and PostgreSQL
        working-directory: tests/stage78-supabase
        run: |
          set -euo pipefail
          supabase --version
          supabase start --exclude studio,storage-api,imgproxy,realtime,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Exercise real HTTP authorization using exact staged staff and order RPC migrations
        working-directory: tests/stage78-supabase
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/stage78-local-credentials.env"
          chmod 600 "$RUNNER_TEMP/stage78-local-credentials.env"
          set -a
          source "$RUNNER_TEMP/stage78-local-credentials.env"
          set +a
          test -n "$API_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f prepare.sql
          node "$GITHUB_WORKSPACE/scripts/stage78AuthPostgrest.mjs"
      - name: Print only local diagnostic container state on failure
        if: failure()
        working-directory: tests/stage78-supabase
        run: docker ps --format 'table {{.Names}}\t{{.Status}}' || true
      - name: Tear down disposable local Supabase
        if: always()
        working-directory: tests/stage78-supabase
        run: supabase stop --no-backup || true
