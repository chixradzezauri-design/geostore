name: Responsive browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/browser/**'
      - '.github/workflows/responsive-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-layout:
    name: Chromium and WebKit mobile checkout smoke
    runs-on: ubuntu-24.04 # Playwright 1.56.1 supports Ubuntu 24.04, not latest 26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build actual production CSS
        run: npm run build
      - name: Install pinned Chromium and WebKit test browsers
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify phone, tablet, desktop widths
        run: node tests/browser/responsiveLayout.mjs
      - name: Open the built GEOSTORE SPA and verify navigation across devices
        env:
          ADMIN_VISUAL_CAPTURE_DIR: ${{ runner.temp }}/admin-visual-review
        run: node tests/browser/realStorefrontSmoke.mjs
      - name: Retain isolated admin visual review screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-visual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admin-visual-review/*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Verify enabled MFA panel in isolated browser fixture
        run: node tests/browser/adminMfaEnabledSmoke.mjs
