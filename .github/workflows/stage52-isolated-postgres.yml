  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-rpc-isolation:
    name: Run checkout public/private RPC contract against disposable PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stage52-fixture-only
          POSTGRES_DB: stage52_checkout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stage52_checkout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Check out Draft PR only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run real Stage51 SQL in isolated PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: stage52_checkout
          PGUSER: postgres
          PGPASSWORD: stage52-fixture-only
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage52_checkout_contract.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage54_order_history_contract.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage56_staff_auth_contract.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage57_order_ledger_scope_contract.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage59_order_status_compat_contract.sql
          node scripts/stage60InventoryLedgerFixture.mjs
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage60_triggers_inventory_contract.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage61_variant_checkout_contract.sql
          node scripts/stage62ReactivationFixture.mjs
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage62_cancelled_order_variant_reactivation.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage65_expenses_order_role_matrix.sql
          node scripts/stage66LegacyCheckoutFixture.mjs
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage66_legacy_checkout_insert_compat_gate.sql
          node scripts/stage67LegacyCheckoutReplayFixture.mjs
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage67_legacy_checkout_ownership_replay.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage68_legacy_admin_product_scope_replay.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/stage69_legacy_variant_history_replay.sql
          node scripts/stage72ReconciledReleaseGate.mjs --verify-pinned
          node scripts/stage73SqlContentParity.mjs --verify-frozen-digests
          node scripts/stage74ReviewedMismatchGate.mjs --verify-frozen
          node scripts/stage75LocalHistoryReconcile.mjs --verify-local-renames
          node scripts/stage76ExistingVersionSqlDivergenceGate.mjs --verify-frozen-review
          node scripts/stage81LiveSchemaGate.mjs --verify-pinned
          node scripts/stage82LiveEffectiveSchemaGate.mjs --verify-pinned
          node scripts/stage86MissingHistoryProvenanceGate.mjs --verify-pinned
          node scripts/stage87PhaseAPreflightHighRiskGate.mjs --verify-pinned
          node scripts/stage88SupportStaffLiveReleaseGate.mjs --verify-pinned

          createdb admin_supplier_purchase
          PGDATABASE=admin_supplier_purchase psql -v ON_ERROR_STOP=1 -f tests/sql/admin_supplier_purchase_contract.sql

          createdb admin_marketing_consent
          PGDATABASE=admin_marketing_consent psql -v ON_ERROR_STOP=1 -f tests/sql/admin_marketing_consent_contract.sql

          node --test tests/advancedAdminReleaseBundle.test.js
          node scripts/advancedAdminReleaseBundle.mjs > /tmp/geostore-advanced-admin-candidate.sql
          createdb advanced_admin_release_bundle
          PGDATABASE=advanced_admin_release_bundle psql -v ON_ERROR_STOP=1 -f tests/sql/advanced_admin_release_bundle_contract.sql

          PGDATABASE=advanced_admin_release_bundle psql -v ON_ERROR_STOP=1 -f tests/sql/advanced_admin_http_fixture.sql
          export ADVANCED_HTTP_JWT_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("hex"))')"
          docker run --detach --name advanced-admin-http-fixture --network host \
            -e PGRST_DB_URI=postgres://advanced_http_authenticator:advanced-http-fixture-only@127.0.0.1:5432/advanced_admin_release_bundle \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=3300 \
            -e PGRST_JWT_SECRET="$ADVANCED_HTTP_JWT_SECRET" postgrest/postgrest:v12.2.3
          trap 'docker rm -f advanced-admin-http-fixture >/dev/null 2>&1 || true' EXIT
          node tests/advancedAdminHttpContract.mjs || { docker logs advanced-admin-http-fixture; exit 1; }
          PGDATABASE=advanced_admin_release_bundle psql -v ON_ERROR_STOP=1 -f tests/sql/advanced_admin_http_inventory_verify.sql
          PGDATABASE=advanced_admin_release_bundle psql -v ON_ERROR_STOP=1 -f tests/sql/advanced_admin_acl_verify.sql

          createdb phase4_wishlist_sync
          PGDATABASE=phase4_wishlist_sync psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_wishlist_sync_contract.sql

          createdb phase4_cart_sync
          PGDATABASE=phase4_cart_sync psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_cart_sync_contract.sql

          createdb phase4_wardrobe
          PGDATABASE=phase4_wardrobe psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_wardrobe_contract.sql

          createdb phase4_admin_mfa
          PGDATABASE=phase4_admin_mfa psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_admin_mfa_guard_contract.sql

          PGDATABASE=phase4_admin_mfa psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_admin_mfa_owner_contract.sql

          PGDATABASE=phase4_admin_mfa psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_admin_mfa_commerce_contract.sql

          PGDATABASE=phase4_admin_mfa psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_admin_mfa_session_rls_contract.sql

          PGDATABASE=phase4_admin_mfa psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_admin_mfa_eligibility_contract.sql

          PGDATABASE=phase4_admin_mfa psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_system_error_history_contract.sql

          PGDATABASE=phase4_admin_mfa psql -v ON_ERROR_STOP=1 -f tests/sql/phase4_system_error_budget_contract.sql
