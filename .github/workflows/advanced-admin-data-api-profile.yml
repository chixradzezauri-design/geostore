name: Advanced admin read-only Data API profile
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/advanced-admin-data-api-profile.yml'
      - 'scripts/advancedAdminDataApiProbe.mjs'
      - 'tests/advancedAdminDataApiProbe.test.js'
      - 'src/supabaseClient.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    # Never send privileged keys, query actual relations or mutate Production.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/advancedAdminDataApiProbe.test.js
      - run: node scripts/advancedAdminDataApiProbe.mjs
